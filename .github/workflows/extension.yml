name: extension-publish

# The editor extension (vscode/) to its two registries: by hand, or when a release is published with a new
# extension version. Neither the Marketplace nor Open VSX supports trusted publishing - each registry uses a
# stored personal access token in its own environment, behind its approval gate.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  marketplace:
    if: github.repository == 'overfocus/rigswig'
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node vscode/test.mjs
      - name: Publish the manifest's version (nothing to do when it is already there)
        run: |
          cd vscode
          echo "publishing kftcda.rigswig $(jq -r .version package.json)"
          if out="$(npx -y @vscode/vsce publish -p "$VSCE_PAT" 2>&1)"; then
            echo "$out"
          else
            echo "$out"
            echo "$out" | grep -qi "already" || exit 1
            echo "already on the marketplace: nothing to do"
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  openvsx:
    # The OVSX_TOKEN secret carries this job: when it is absent the job ends after its gate step.
    runs-on: ubuntu-latest
    environment: openvsx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The OVSX_TOKEN gate
        run: |
          if [ -n "$OVSX_TOKEN" ]; then
            echo "HAS_TOKEN=true" >> "$GITHUB_ENV"
          else
            echo "OVSX_TOKEN is not set yet; ending here"
          fi
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      - run: node vscode/test.mjs
        if: env.HAS_TOKEN == 'true'
      - name: Publish the manifest's version (the namespace exists after the first run)
        if: env.HAS_TOKEN == 'true'
        run: |
          cd vscode
          echo "publishing kftcda.rigswig $(jq -r .version package.json)"
          npx -y ovsx create-namespace kftcda --pat "$OVSX_TOKEN" \
            || echo "create-namespace did not take (the namespace likely already exists from the dashboard); publishing"
          if out="$(npx -y ovsx publish --pat "$OVSX_TOKEN" 2>&1)"; then
            echo "$out"
          else
            echo "$out"
            echo "$out" | grep -qi "already" || exit 1
            echo "already on open vsx: nothing to do"
          fi
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
