name: release

# Runs only when a version tag is pushed (v0.1.0, ...). See docs/RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag matches the crate version
        run: |
          want="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="rigswig") | .version')"
          test "$want" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml ($want)"; exit 1; }
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, ext: "" }
          - { target: x86_64-apple-darwin, os: macos-latest, ext: "" }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true, ext: "" }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true, ext: "" }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p rigswig
      - name: Package
        shell: bash
        run: |
          name="rigswig-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE NOTICE README.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/rigswig.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/rigswig" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Stage the npm package for this target (npm/build.mjs; the `npm` job publishes it)
        shell: bash
        run: node npm/build.mjs --version "$GITHUB_REF_NAME" --target ${{ matrix.target }} --binary "target/${{ matrix.target }}/release/rigswig${{ matrix.ext }}" --out npm-stage
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ASSET }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: npm-stage

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the release tarballs: the npm packages are the `npm` job's to publish.
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --generate-notes

  # crates.io, through trusted publishing: the job gets a short-lived token from crates.io with GitHub's OIDC, so no
  # token is stored anywhere. It waits in the `crates-io` environment until the maintainer approves the run (a
  # published version cannot be deleted). crates.io accepts it only from this repo, this workflow and that environment
  # (each crate's Trusted Publishing settings). docs/RELEASING.md.
  crates-io:
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish rigswig-core, then rigswig
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # npm: five packages carrying the binary per platform, then the unscoped `rigswig` picker, published
  # through npm's trusted publishing, like crates.io: GitHub's OIDC in the `npm` environment, so no
  # token is stored, after a maintainer approves the run ("Review deployments"). npm cannot grant
  # trusted publishing to a brand-new package: the first version of each of the six was bootstrapped
  # by hand, and each package's Trusted Publisher settings on npmjs.com accept only this repo,
  # release.yml and the `npm` environment (docs/RELEASING.md). Each `npm-<target>` artifact roots at
  # its package directories (the upload path is the common ancestor, so the `npm-stage/` prefix it was
  # staged under does not travel), hence `stage/` directly after the merge-multiple download.
  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm can be older.
      - run: npm install --global npm@latest
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: stage
          merge-multiple: true
      - name: The six packages are here, at the tag's version
        run: |
          root=stage
          want="${GITHUB_REF_NAME#v}"
          for pkg in rigswig @kftcda/cli-darwin-arm64 @kftcda/cli-darwin-x64 @kftcda/cli-linux-arm64 @kftcda/cli-linux-x64 @kftcda/cli-win32-x64; do
            test -f "$root/$pkg/package.json" || { echo "missing $pkg (have: $(find "$root" -mindepth 1 -maxdepth 2 -type d -printf '%P\n'))"; exit 1; }
            ver="$(jq -r .version "$root/$pkg/package.json")"
            test "$ver" = "$want" || { echo "$pkg is at $ver, want $want"; exit 1; }
          done
      # The artifact round-trip can drop the executable bit; restore it before anything is packed.
      - name: Make the binaries executable again
        run: find stage -path '*/bin/*' -type f -exec chmod a+x {} +
      - name: Pack every package, dry run
        run: |
          shopt -s nullglob
          for pkg in stage/@kftcda/*/ stage/rigswig; do
            (cd "$pkg" && npm publish --dry-run --access public > /dev/null)
          done
      - name: Publish the platform packages, then the picker
        run: |
          shopt -s nullglob
          for pkg in stage/@kftcda/*/; do
            (cd "$pkg" && npm publish --access public)
          done
          (cd stage/rigswig && npm publish)
