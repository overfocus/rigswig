<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>rigswig</title>
<style nonce="__NONCE__">
/* kevinferron.com's two faces, inlined by the server (src/ui.rs): no font is fetched. */
@font-face { font-family: "Josefin Sans"; font-weight: 100 700; font-display: block; src: url(data:font/ttf;base64,__FONT_JOSEFIN__) format("truetype"); }
@font-face { font-family: "Pixelify Sans"; font-weight: 400 700; font-display: block; src: url(data:font/ttf;base64,__FONT_PIXELIFY__) format("truetype"); }

/* Dark is the brand (kevinferron.com): black, one neon green accent, a box edge per kind. */
:root {
  color-scheme: dark;
  --bg: #0a0a0a; --box: #111111; --soft: #1b1b1b; --fg: #f2f2f2; --muted: #a8a8b0; --line: rgba(255, 255, 255, 0.15);
  --green: #39ff00; --cyan: #22d3ee; --warn: #ffc14d;
  /* Kind colours: bright on black, and never the only cue (every kind is also named). */
  --k-instruction: #22d3ee; --k-agent: #ff9f43; --k-skill: #39ff00; --k-command: #f472b6;
  --k-mcp: #facc15; --k-hook: #b4b4bc; --k-permission: #a78bfa;
  --a: #39ff00; --b: #22d3ee;
  --pixel: "Pixelify Sans", ui-monospace, monospace;
  --body: "Josefin Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 16px 16px 40px; }
a { color: var(--green); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 4px; }
.approx { font-family: var(--body); font-weight: 400; margin-right: 0.04em; }
.hide-sm { display: none; }
.mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.px { font-family: var(--pixel); text-transform: uppercase; letter-spacing: 0.08em; }

/* Header: the rigswig wordmark, "brought to you by" the glowing kevinferron.com, the harness switcher. */
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mark { font-family: var(--pixel); font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: 0.02em; margin: 0; }
.mark span { color: var(--green); text-shadow: 0 0 6px rgba(57, 255, 0, 0.45); }
.by { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 44px; }
.by small { font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
.by a { display: inline-flex; align-items: center; min-height: 44px; border-radius: 6px; }
.by svg { width: 196px; height: auto; overflow: visible; display: block; }
.where { color: var(--muted); font-size: 15px; margin: 2px 0 0; }
.where b { color: var(--fg); font-weight: 600; }
.switch { margin-left: auto; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
nav.tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
nav.tools a, nav.tools span, .chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--fg); text-decoration: none; font: 15px var(--body); background: transparent;
}
nav.tools a:hover, .chip:hover { border-color: var(--green); }
nav.tools span[aria-current] { border-color: var(--green); color: var(--green); background: rgba(57, 255, 0, 0.08); }
.badge { font-size: 13px; color: var(--muted); }

/* Boxes: the home page's bento. A 2px coloured top edge, a Pixelify head, dense content. */
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.box { position: relative; background: var(--box); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 14px; min-width: 0; }
.box::before { content: ""; position: absolute; left: 12px; right: 12px; top: -1px; height: 2px; border-radius: 2px; background: var(--edge, var(--green)); }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 0 0 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
h2, .h2 { font-family: var(--pixel); font-weight: 500; font-size: 15px; text-transform: uppercase; letter-spacing: 0.1em; margin: 0; color: var(--edge-text, var(--green)); }
.head .aside { margin-left: auto; color: var(--muted); font-size: 14px; }

/* The budget. */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px 24px; }
.big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0; font-weight: 400; }
.big b { font-family: var(--pixel); font-weight: 600; font-size: 48px; line-height: 1; color: var(--green); text-shadow: 0 0 10px rgba(57, 255, 0, 0.35), 0 0 24px rgba(34, 211, 238, 0.18); }
.big span { font-size: 20px; }
.sub { color: var(--muted); margin: 6px 0 0; font-size: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.sub strong { color: var(--fg); font-weight: 600; }
select {
  font: 15px var(--body); color: var(--fg); background: var(--soft); border: 1px solid var(--line); border-radius: 8px;
  min-height: 44px; padding: 0 10px; cursor: pointer;
}
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; align-self: start; }
.stat { background: var(--box); padding: 8px 10px; min-width: 0; }
.stat b { display: block; font-family: var(--pixel); font-weight: 500; font-size: 20px; line-height: 1.15; overflow-wrap: anywhere; }
.stat > span { display: block; font-size: 13px; color: var(--muted); }
.stat.warn b { color: var(--warn); }

.bars { margin-top: 14px; }
.barrow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px 12px; align-items: center; }
.barrow > b { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.bar { position: relative; display: flex; gap: 2px; height: 34px; border-radius: 6px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); }
.barrow .bar { height: 26px; margin-bottom: 6px; }
.bar > i { display: block; height: 100%; min-width: 3px; flex: none; }
.bar > i.unmeasured {
  min-width: 34px; flex: none; display: flex; align-items: center; justify-content: center; font: 600 14px var(--body); font-style: normal; color: var(--fg);
  background: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0 5px, rgba(255, 255, 255, 0.38) 5px 7px);
  border-left: 1px dashed var(--fg);
}
.scale { position: relative; height: 16px; color: var(--muted); font-size: 12px; margin-top: 2px; }
.scale span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.scale span:first-child { transform: none; }
.scale span:last-child { transform: translateX(-100%); }
.note { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; background: rgba(255, 193, 77, 0.1); border: 1px solid rgba(255, 193, 77, 0.35); color: var(--warn); font-size: 15px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; background: var(--kc, var(--muted)); }
.sw.hatch { background: repeating-linear-gradient(135deg, transparent 0 3px, var(--fg) 3px 4px); border: 1px solid var(--fg); }
.unm { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 14px; color: var(--muted); }
.unm span { display: inline-flex; align-items: center; gap: 6px; }

/* Kind tiles: the legend of the bar, and each opens its inventory in place, under its own row. */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; margin-top: 14px; }
.tile {
  position: relative; text-align: left; min-height: 44px; padding: 10px 10px 9px; border-radius: 10px; cursor: pointer; color: var(--fg);
  background: var(--soft); border: 1px solid var(--line); font: 15px var(--body); display: flex; flex-direction: column; gap: 3px; min-width: 0;
}
.tile::before { content: ""; position: absolute; left: 8px; right: 8px; top: -1px; height: 2px; border-radius: 2px; background: var(--kc); }
.tile:hover { border-color: var(--kc); }
.tile[aria-expanded="true"] { border-color: var(--kc); background: #222; }
.tile .t { display: flex; align-items: center; gap: 6px; font-family: var(--pixel); font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--kc); }
.tile .t::after { content: "+"; margin-left: auto; color: var(--muted); font-family: var(--body); font-size: 18px; line-height: 1; }
.tile[aria-expanded="true"] .t::after { content: "\2212"; }
.tile .v { font-family: var(--pixel); font-weight: 500; font-size: 22px; line-height: 1.1; }
.tile .v small { font-family: var(--body); font-size: 14px; color: var(--muted); font-weight: 400; }
.tile .c { font-size: 13px; color: var(--muted); }
.tile .m { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); overflow: hidden; margin-top: 3px; }
.tile .m i { display: block; height: 100%; background: var(--kc); min-width: 1px; }
.panel { grid-column: 1 / -1; background: #151515; border: 1px solid var(--kc); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.panel .head { margin-bottom: 4px; }
.panel h3 { margin: 0; font-family: var(--pixel); font-weight: 500; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--kc); }

/* Rows: dense lists with a proportional bar behind the name. */
ul.rows { list-style: none; margin: 0; padding: 0; }
ul.rows > li { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 6px 8px; border-top: 1px solid rgba(255, 255, 255, 0.07); min-height: 40px; }
ul.rows > li:first-child { border-top: 0; }
ul.rows > li:has(> button.act) { grid-template-columns: minmax(0, 1fr) auto auto; }
ul.rows > li > button.act { margin-left: 0; }
ul.rows > li > .fill { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 4px; background: var(--kc); opacity: 0.16; pointer-events: none; }
ul.rows > li > .fill::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--kc); opacity: 1; }
.rowname { position: relative; min-width: 0; overflow-wrap: anywhere; }
.rowname .meta { display: block; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.rownum { position: relative; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 15px; }
.rownum small { display: block; font-size: 13px; color: var(--muted); }
.status { white-space: nowrap; font-size: 14px; }
.status.on { color: var(--green); }
.status.off { color: var(--muted); }
.k { display: inline-flex; align-items: center; gap: 5px; }

/* What costs the most: a strip of the biggest pieces on the measured total, then the ranked rows. */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { cursor: pointer; font-size: 14px; padding: 0 12px; }
.chip[aria-pressed="true"] { border-color: var(--green); color: var(--green); background: rgba(57, 255, 0, 0.08); }
.strip { display: flex; gap: 2px; height: 22px; border-radius: 5px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); margin-bottom: 6px; }
.strip i { display: block; height: 100%; min-width: 2px; flex: none; background: var(--kc); }
.strip i.rest { background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.22) 0 2px, transparent 2px 4px); flex: 1 1 auto; }
.lead { margin: 0 0 8px; font-size: 15px; }
.lead b { font-family: var(--pixel); font-weight: 500; color: var(--green); }
.more { margin-top: 8px; }
button.link { font: 15px var(--body); color: var(--green); background: transparent; border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 0 14px; cursor: pointer; }
button.link:hover { border-color: var(--green); }

/* Collapsible boxes: the head is the summary. */
details.box > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px 12px; min-height: 44px; margin: -6px 0; }
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary::after { content: "+"; margin-left: 8px; color: var(--muted); font-size: 20px; line-height: 1; }
details.box[open] > summary::after { content: "\2212"; }
details.box[open] > summary { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
details.box > summary .aside { margin-left: auto; color: var(--muted); font-size: 14px; }
details.sub2 { border-top: 1px solid rgba(255, 255, 255, 0.07); }
details.sub2:first-of-type { border-top: 0; }
details.sub2 > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 2px; }
details.sub2 > summary::-webkit-details-marker { display: none; }
details.sub2 > summary::before { content: "\25B8"; color: var(--muted); width: 1em; }
details.sub2[open] > summary::before { content: "\25BE"; }
details.sub2 > summary .aside { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

/* Settings: the value, then the decision trail as steps, the winner first. */
.setting { padding: 8px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); }
.setting:first-child { border-top: 0; padding-top: 0; }
.setting .n { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.setting .val { overflow-wrap: anywhere; }
ol.trail { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 0; padding: 0; }
ol.trail li { font-size: 13px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); overflow-wrap: anywhere; max-width: 100%; }
ol.trail li:first-child { color: var(--fg); border-color: var(--green); }
ol.trail li + li::before { content: "beats "; }
ul.warn { list-style: none; margin: 0; padding: 0; }
ul.warn li { padding: 5px 0 5px 22px; position: relative; font-size: 15px; overflow-wrap: anywhere; }
ul.warn li::before { content: "\25B2"; position: absolute; left: 2px; top: 6px; color: var(--warn); font-size: 12px; }
ul.plain { margin: 0; padding-left: 18px; font-size: 15px; }
ul.plain li { margin: 3px 0; }

/* Comparing: the differences per kind as a split of counts. */
.diffrow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 12px; padding: 6px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); align-items: center; }
.diffrow:first-of-type { border-top: 0; }
.dsplit { display: flex; gap: 2px; height: 10px; border-radius: 4px; overflow: hidden; background: var(--soft); }
.dsplit i { display: block; height: 100%; min-width: 3px; }
.d-a { background: var(--a); } .d-b { background: var(--b); }
.d-c { background: repeating-linear-gradient(135deg, var(--warn) 0 3px, transparent 3px 5px); border: 1px solid var(--warn); }
.d-s { background: #555; }
.dnums { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dnums b { color: var(--fg); font-weight: 600; }
.dkey { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.dkey span { display: inline-flex; align-items: center; gap: 5px; }
.dkey i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

footer { color: var(--muted); font-size: 14px; margin-top: 20px; }

@media (min-width: 560px) {
  .barrow { grid-template-columns: minmax(96px, max-content) minmax(0, 1fr); }
  .barrow .bar { margin: 3px 0; }
  .hide-sm { display: block; }
  .diffrow { grid-template-columns: 130px minmax(0, 1fr); }
  .diffrow .dnums { grid-column: 2; }
}
@media (min-width: 760px) {
  ul.rows.dense > li { min-height: 36px; padding-top: 4px; padding-bottom: 4px; }
  ul.rows.dense .rowname .meta { display: inline; margin-left: 10px; }
  ul.rows.dense .rownum small { display: inline-block; min-width: 4.2em; margin-left: 8px; }
  .hero { grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 1000px) {
  .diffrow { grid-template-columns: 130px minmax(0, 1fr) auto; }
  .diffrow .dnums { grid-column: 3; justify-content: flex-end; }
  .grid.two { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; }
  .col { display: grid; gap: 12px; min-width: 0; }
}
@media (max-width: 559px) {
  .switch { margin-left: 0; align-items: flex-start; width: 100%; }
  nav.tools { justify-content: flex-start; }
  .big b { font-size: 40px; }
  .mark { font-size: 30px; }
}
@media (max-width: 399px) {
  /* Too narrow for two tiles a row: each tile becomes one compact row, name left and size right. */
  .tiles { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .tile { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; align-items: baseline; padding: 8px 10px; }
  .tile .t { grid-column: 1; grid-row: 1; }
  .tile .v { grid-column: 2; grid-row: 1 / span 2; font-size: 18px; text-align: right; align-self: center; }
  .tile .c { grid-column: 1; grid-row: 2; }
  .tile .m { grid-column: 1 / -1; grid-row: 3; }
}
@media (prefers-reduced-motion: no-preference) {
  .tile, .chip, nav.tools a, button.link { transition: border-color 150ms ease, background-color 150ms ease; }
  .panel { animation: open 160ms ease-out; }
  @keyframes open { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* Write mode (rigswig ui --allow-writes): the change sheet, the diff, the banner. */
.badge.writes { color: var(--warn); font-weight: 700; }
button.act { font: 600 14px/1 var(--body); color: var(--bg); background: var(--green); border: 0; border-radius: 8px; min-height: 44px; padding: 0 14px; cursor: pointer; margin-left: 10px; white-space: nowrap; }
button.act.off { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 75vh; overflow: auto; background: var(--box); border-top: 2px solid var(--warn); box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.6); padding: 16px max(16px, calc((100vw - 1060px) / 2)); }
.sheet h2 { font: 700 16px/1.2 var(--pixel); color: var(--warn); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }
.sheet fieldset { border: 0; padding: 0; margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.sheet legend { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
.sheet label { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; cursor: pointer; }
.sheet .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.sheet .err { color: var(--warn); }
.sheet ul.notes { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
pre.diff { font: 13px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: 8px 0 0; max-height: 40vh; }
pre.diff span { display: block; white-space: pre; }
pre.diff .add { color: var(--green); }
pre.diff .del { color: #ff7a7a; }
.banner { position: sticky; top: 0; z-index: 15; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: #1d1a0d; border: 1px solid var(--warn); border-radius: 10px; padding: 8px 14px; margin-bottom: 14px; }
.banner[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<noscript><p>This page needs JavaScript to draw. The same data is in <code>rigswig status --json</code>.</p></noscript>
<script type="application/json" id="data" nonce="__NONCE__">__DATA__</script>
<script nonce="__NONCE__">
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("data").textContent);
  var h = data.harness;
  var KINDS = ["instruction", "agent", "skill", "command", "mcp", "hook", "permission"];
  var TITLE = { instruction: "Instructions", agent: "Agents", skill: "Skills", command: "Commands", mcp: "MCP servers", hook: "Hooks", permission: "Permissions" };
  var WINDOWS = [128000, 200000, 272000, 400000, 1000000];
  var SVG = "http://www.w3.org/2000/svg";

  // Every value from the data goes in through textContent or a non-style attribute; styles only through el.style (the CSP allows CSSOM, not a style attribute).
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var key in attrs) {
      var v = attrs[key];
      if (v == null) continue;
      if (key === "text") n.textContent = v;
      else if (key === "cls") n.className = v;
      else if (key === "style") n.style.cssText = v;
      else n.setAttribute(key, v);
    }
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function svg(tag, attrs, kids) {
    var n = document.createElementNS(SVG, tag);
    for (var key in attrs) n.setAttribute(key, attrs[key]);
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function fmt(n) { return Math.round(n).toLocaleString("en-US"); }
  function k(n) { return n >= 1000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, "") + "k" : String(n); }

        el("summary", null, [title, el("span", { cls: "aside", text: String(rows.length) })]),
        ul,
        rows.length > 15 ? el("p", { cls: "muted", text: "The " + (rows.length - 15) + " smallest are left out; rigswig compare --json lists them all." }) : null
      ]));
    }
    var one = function (e) { return el("li", null, [el("span", { cls: "rowname" }, [e.name, el("span", { cls: "meta", text: e.kind + " · " + e.layer })]), el("span", { cls: "rownum", text: e.chars ? "~" + k(tok(e.chars)) : "–" })]); };
    var wrapDiffs = el("div", { style: "margin-top:8px" });
    dsec.appendChild(wrapDiffs);
    var dlist = dsec;
    dsec = wrapDiffs;
    list("Only in A (" + cmp.a.tool + ")", cmp.onlyA, one);
    list("Only in B (" + cmp.b.tool + ")", cmp.onlyB, one);
    list("In both, but different", cmp.changed, function (c) { return el("li", null, [el("span", { cls: "rowname" }, [c.name, el("span", { cls: "meta", text: c.kind })]), el("span", { cls: "rownum", text: "A ~" + k(tok(c.a.chars)) + " · B ~" + k(tok(c.b.chars)) })]); });
    list("Settings that differ", cmp.settings, function (d) { return el("li", null, [el("span", { cls: "rowname mono", text: d.name }), el("span", { cls: "rownum", text: "A " + val(d.a) + " · B " + val(d.b) })]); });
    left.appendChild(dlist);
  }

  // ---- What costs the most ------------------------------------------------------------------------------------
  var top = el("section", { cls: "box", "aria-labelledby": "top-h" });
  top.appendChild(el("div", { cls: "head" }, [el("h2", { id: "top-h", text: "What costs the most" }), el("span", { cls: "aside", text: "at startup, by tokens" })]));
  var filter = null, showAll = false;
  var chips = el("div", { cls: "chips", role: "group", "aria-label": "Filter by kind" });
  var body = el("div");
  function drawTop(focusKind) {
    chips.textContent = "";
    [null].concat(KINDS.filter(function (x) { return byKind[x]; })).forEach(function (x) {
      var b = el("button", { type: "button", cls: "chip", style: x ? kc(x) : null, "aria-pressed": String(filter === x), "data-k": x || "all" }, [x ? el("i", { cls: "sw", "aria-hidden": "true" }) : null, x ? TITLE[x] : "All"]);
      b.addEventListener("click", function () { filter = x; showAll = false; drawTop(x || "all"); });
      chips.appendChild(b);
    });
    if (focusKind) { var f = chips.querySelector('[data-k="' + focusKind + '"]'); if (f) f.focus(); }
    body.textContent = "";
    var rows = ranked.filter(function (i) { return !filter || i.kind === filter; });
    var sum = rows.reduce(function (s, i) { return s + i.load.chars.value; }, 0);
    var n = Math.min(3, rows.length);
    var topN = rows.slice(0, n).reduce(function (s, i) { return s + i.load.chars.value; }, 0);
    if (rows.length) {
      body.appendChild(el("p", { cls: "lead" }, [
        rows.length + " " + (filter ? TITLE[filter].toLowerCase() : "pieces") + " cost ~" + k(tok(sum)) + (filter ? " (" + pct(sum / total * 100) + " of what is measured)" : "") + "; the " + (n === 1 ? "biggest" : n + " biggest") + " are ",
        el("b", { text: pct(topN / total * 100) }), "."
      ]));
    }
    // The strip: each piece's share of the whole measured total, biggest first; the rest of the total hatched.
    var strip = el("div", { cls: "strip", "aria-hidden": "true" });
    rows.slice(0, 40).forEach(function (i) { strip.appendChild(el("i", { style: kc(i.kind) + ";width:" + i.load.chars.value / total * 100 + "%", title: i.name + ": ~" + k(tok(i.load.chars.value)) })); });
    strip.appendChild(el("i", { cls: "rest", title: "everything else measured" }));
    body.appendChild(strip);
    var shown = showAll ? rows : rows.slice(0, 12);
    var max = rows.length ? rows[0].load.chars.value : 1;
    var ul = el("ul", { cls: "rows dense" });
    shown.forEach(function (i) {
      ul.appendChild(el("li", { style: kc(i.kind) }, [
        el("i", { cls: "fill", style: "width:" + Math.max(0.5, i.load.chars.value / max * 100) + "%", "aria-hidden": "true" }),
        el("span", { cls: "rowname" }, [i.name, el("span", { cls: "meta" }, [el("span", { cls: "k" }, [el("i", { cls: "sw", "aria-hidden": "true" }), i.kind]), " · " + i.origin.layer])]),
        el("span", { cls: "rownum" }, ["~" + k(tok(i.load.chars.value)), el("small", { text: pct(i.load.chars.value / total * 100) })])
      ]));
    });
    body.appendChild(ul);
    if (rows.length > shown.length) {
      var more = el("button", { type: "button", cls: "link", text: "Show all " + rows.length });
      more.addEventListener("click", function () { showAll = true; drawTop(); var r = body.querySelectorAll("ul.rows > li")[12]; if (r) { r.setAttribute("tabindex", "-1"); r.focus(); } });
      body.appendChild(el("div", { cls: "more" }, [more]));
    }
  }
  drawTop();
  top.appendChild(chips);
  top.appendChild(body);
  left.appendChild(top);

  // ---- Side column: warnings, settings, what is not modelled (collapsed; the count is in the head) --------------
  function side(id, title, aside, edge, kids, open) {
    var d = el("details", { cls: "box", style: edge ? "--edge:" + edge + ";--edge-text:" + edge : null }, [
      el("summary", null, [el("span", { cls: "h2", id: id, text: title }), aside ? el("span", { cls: "aside", text: aside }) : null])
    ].concat(kids));
    if (open) d.open = true;
    return d;
  }
  if (h.warnings.length) {
    var groups = {}, order = [];
    h.warnings.forEach(function (w) { if (!groups[w.code]) { groups[w.code] = []; order.push(w.code); } groups[w.code].push(w); });
    var wl = el("ul", { cls: "warn" });
    order.forEach(function (code) {
      groups[code].forEach(function (w) { wl.appendChild(el("li", null, [w.message, w.file ? el("span", { cls: "meta mono muted", text: " " + w.file }) : null])); });
    });
    right.appendChild(side("warn-h", "▲ Warnings", h.warnings.length + " · " + order.join(", "), "var(--warn)", [wl], h.warnings.length <= 3));
  }
  var names = Object.keys(h.settings);
  if (names.length) {
    var sl = el("div");
    names.forEach(function (name) {
      var d = h.settings[name];
      var v = d.value === null ? "the tool's default" : val(d.value);
      var row = el("div", { cls: "setting" }, [
        el("div", { cls: "n", text: name }),
        el("div", { cls: "val" }, [v, d.source ? el("span", { cls: "muted", text: " · set by " + d.source }) : null])
      ]);
      if (d.trail.length > 1) row.appendChild(el("ol", { cls: "trail", "aria-label": "Decision trail, the winner first" }, d.trail.map(function (s) {
        return el("li", { text: s.layer + ": " + val(s.value) + (s.note ? " (" + s.note + ")" : "") });
      })));
      sl.appendChild(row);
    });
    right.appendChild(side("set-h", "Settings", names.length + " · where each came from", "var(--cyan)", [sl], false));
  }
  right.appendChild(side("cov-h", "Not modelled", String(h.coverage.notModelled.length), "#b4b4bc", [
    el("ul", { cls: "plain" }, h.coverage.notModelled.map(function (n) { return el("li", { text: n }); }))
  ], false));

  app.appendChild(el("footer", { text: "rigswig " + data.version + " · " + h.tool.id + " adapter " + h.tool.adapterVersion + " · read from files on this machine; nothing was sent or written. Reload to read again." }));

  // ---- Write mode (rigswig ui --allow-writes) ------------------------------------------------------------------
  // A change is planned on the server (file, diff, budget after) and applied only on Apply; the server re-checks the
  // file is unchanged, writes atomically after a backup, and keeps the change for Undo.
  function actButton(label, on, onClick) {
    var b = el("button", { type: "button", cls: "act" + (on ? " off" : ""), text: label });
    b.addEventListener("click", onClick);
    return b;
  }
  function call(route, body) {
    return fetch(route + "?tool=" + encodeURIComponent(h.tool.id), {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Rigswig-Token": token },
      body: JSON.stringify(body),
      credentials: "same-origin"
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }); });
  }
  var banner = el("div", { cls: "banner", hidden: "", role: "status", "aria-live": "polite" });
  if (data.writes) app.insertBefore(banner, app.children[1] || null);
  function say(parts) {
    banner.textContent = "";
    parts.forEach(function (x) { if (x) banner.appendChild(typeof x === "string" ? document.createTextNode(x) : x); });
    banner.removeAttribute("hidden");
  }
  var sheet = null, opener = null;
  function closeSheet() {
    if (sheet) { sheet.remove(); sheet = null; }
    if (opener) { opener.focus(); opener = null; }
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && sheet) closeSheet(); });
  function openChange(base, title) {
    closeSheet();
    opener = document.activeElement;
    var scope = "local";
    sheet = el("section", { cls: "sheet", role: "dialog", "aria-modal": "false", "aria-labelledby": "sheet-h" });
    var body = el("div");
    var fs = el("fieldset", null, [el("legend", { text: "Where to write it" })]);
    [["local", "This repo, just me"], ["project", "This repo, everyone (committed)"], ["user", "Every repo, just me"]].forEach(function (o) {
      var input = el("input", { type: "radio", name: "scope", value: o[0] });
      if (o[0] === scope) input.checked = true;
      input.addEventListener("change", function () { scope = o[0]; preview(); });
      fs.appendChild(el("label", null, [input, o[1]]));
    });
    sheet.appendChild(el("h2", { id: "sheet-h", text: title }));
    sheet.appendChild(fs);
    sheet.appendChild(body);
    document.body.appendChild(sheet);
    fs.querySelector("input").focus();
    function change() { var c = JSON.parse(JSON.stringify(base)); c.scope = scope; return c; }
    function preview() {
      body.textContent = "Planning…";
      call("/api/plan", change()).then(function (plan) {
        body.textContent = "";
        body.appendChild(el("p", null, [
          (plan.createsFile ? "Creates " : "Changes ") , el("b", { cls: "mono", text: plan.file }),
          " · budget ", el("b", { text: "~" + k(plan.tokensBefore) + " → ~" + k(plan.tokensAfter) }), " tokens"
        ]));
        var pre = el("pre", { cls: "diff", "aria-label": "The change to the file" });
        plan.diff.forEach(function (l) { pre.appendChild(el("span", { cls: l.op === "+" ? "add" : l.op === "-" ? "del" : "", text: l.op + " " + l.text })); });
        body.appendChild(pre);
        body.appendChild(el("ul", { cls: "notes" }, plan.notes.map(function (n) { return el("li", { text: n }); })));
        var apply = el("button", { type: "button", cls: "act", text: plan.takesEffect ? "Apply" : "Apply anyway" });
        var cancel = el("button", { type: "button", cls: "act off", text: "Cancel" });
        cancel.addEventListener("click", closeSheet);
        apply.addEventListener("click", function () {
          apply.disabled = true;
          call("/api/apply", { change: change(), beforeHash: plan.beforeHash }).then(function (done) {
            closeSheet();
            var undo = actButton("Undo", true, function () {
              undo.disabled = true;
              call("/api/undo", {}).then(function (u) { say(["Undone: ", el("b", { cls: "mono", text: u.undone }), " is back as it was. ", reload()]); })
                .catch(function (e) { say(["Undo failed: " + e.message]); });
            });
            say(["Applied to ", el("b", { cls: "mono", text: done.applied }), done.backup ? " · backup saved" : " · new file", " · takes effect in the next session. ", undo, reload()]);
            undo.focus();
          }).catch(function (e) { apply.disabled = false; body.appendChild(el("p", { cls: "err", text: e.message })); });
        });
        body.appendChild(el("div", { cls: "row" }, [apply, cancel]));
      }).catch(function (e) {
        body.textContent = "";
        body.appendChild(el("p", { cls: "err", text: e.message }));
        var cancel = el("button", { type: "button", cls: "act off", text: "Close" });
        cancel.addEventListener("click", closeSheet);
        body.appendChild(el("div", { cls: "row" }, [cancel]));
      });
    }
    preview();
  }
  function reload() {
    var b = actButton("Reload to read again", false, function () { location.reload(); });
    return b;
  }
})();
</script>
</body>
</html>
