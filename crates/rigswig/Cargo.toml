[package]
name = "rigswig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
description.workspace = true
# The repo's README, copied into the package by cargo; crates.io resolves its relative links and images against
# `repository`.
readme = "../../README.md"
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rigswig"
path = "src/main.rs"

[features]
# `--github` downloads a public repo's archive: the only network code in rigswig. Build with --no-default-features for
# a rigswig that cannot make a network request at all (`--archive` still works).
default = ["github"]
github = ["dep:ureq"]

[dependencies]
rigswig-core = { path = "../rigswig-core", version = "0.3.0" }

# Reading a repo archive into memory (`--archive`, `--github`): gzip in pure Rust, and tar without extended attributes.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
# HTTPS with rustls and the Mozilla root store, nothing else (no cookies, no proxy from the environment, no gzip).
ureq = { version = "2.12", default-features = false, features = ["tls"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# OS-backed randomness for the local page's authentication token and write-mode temporary names. There is deliberately
# no pseudo-random fallback: without the OS source, the server and write operation refuse to proceed.
getrandom = "0.3"

# One signal call (main, unix only): reset SIGPIPE to the default, so a closed pipe ends the process the way a
# unix CLI should instead of panicking mid-print.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rigswig-core = { path = "../rigswig-core" }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
serde_json = "1.0.154"
