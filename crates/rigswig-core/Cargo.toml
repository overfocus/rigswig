[package]
name = "rigswig-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
readme = "README.md"
categories = ["development-tools", "parser-implementations"]
description = "The harness-neutral data model and the per-harness adapters behind rigswig. No I/O of its own: adapters read through an injected file system."

[dependencies]
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
serde_json = "1"
